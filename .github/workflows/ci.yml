name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NG_BUILD_BUDGETS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test admin
        run: npx nx test admin
      - name: Test waiter
        run: npx nx test waiter
      - name: Build admin
        run: npx nx build admin
      - name: Build waiter
        run: npx nx build waiter
      - name: Build public-menu
        run: npx nx build public-menu