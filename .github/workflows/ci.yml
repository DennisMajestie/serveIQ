name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NG_BUILD_BUDGETS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test admin
        run: npx nx test admin
      - name: Test waiter
        run: npx nx test waiter
      - name: Build admin
        run: npx nx build admin
      - name: Build waiter
        run: npx nx build waiter
      - name: Build public-menu
        run: npx nx build public-menu
