<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ServeIQ - Settle Bill</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
        }
        .neon-glow-azure {
            box-shadow: 0 0 20px rgba(5, 102, 217, 0.3);
        }
        .neon-glow-primary {
            box-shadow: 0 0 25px rgba(75, 226, 119, 0.5);
        }
        body {
            background: radial-gradient(circle at top right, #1e293b 0%, #020617 100%);
            min-height: 100vh;
            color: #dce1fb;
        }
        .active-settle-card {
            background: rgba(75, 226, 119, 0.1);
            box-shadow: inset 0 0 15px rgba(75, 226, 119, 0.2);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#005321",
                      "on-background": "#dce1fb",
                      "error": "#ffb4ab",
                      "on-tertiary-container": "#840025",
                      "surface-tint": "#4ae176",
                      "primary-fixed-dim": "#4ae176",
                      "on-tertiary-fixed-variant": "#92002a",
                      "tertiary": "#ffb3b7",
                      "surface-variant": "#2e3447",
                      "surface-container-lowest": "#070d1f",
                      "primary": "#4be277",
                      "on-secondary": "#002e6a",
                      "primary-fixed": "#6bff8f",
                      "tertiary-container": "#ff8892",
                      "surface-container-highest": "#2e3447",
                      "on-surface-variant": "#bccbb9",
                      "inverse-on-surface": "#2a3043",
                      "surface-container": "#191f31",
                      "surface": "#0c1324",
                      "surface-container-low": "#151b2d",
                      "surface-dim": "#0c1324",
                      "secondary-fixed": "#d8e2ff",
                      "on-secondary-fixed-variant": "#004395",
                      "primary-container": "#22c55e",
                      "on-primary-fixed": "#002109",
                      "on-tertiary-fixed": "#40000d",
                      "outline": "#869585",
                      "secondary-container": "#0566d9",
                      "surface-container-high": "#23293c",
                      "inverse-primary": "#006e2f",
                      "background": "#0c1324",
                      "surface-bright": "#33394c",
                      "inverse-surface": "#dce1fb",
                      "outline-variant": "#3d4a3d",
                      "on-primary-container": "#004b1e",
                      "on-primary": "#003915",
                      "on-secondary-fixed": "#001a42",
                      "on-secondary-container": "#e6ecff",
                      "tertiary-fixed": "#ffdadb",
                      "on-tertiary": "#67001b",
                      "tertiary-fixed-dim": "#ffb2b7",
                      "secondary-fixed-dim": "#adc6ff",
                      "on-surface": "#dce1fb",
                      "error-container": "#93000a",
                      "on-error-container": "#ffdad6",
                      "secondary": "#adc6ff",
                      "on-error": "#690005"
              },
              "spacing": {
                      "inner-padding": "24px",
                      "container-padding": "32px",
                      "bento-gap": "20px",
                      "unit": "8px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-md": ["Space Grotesk"],
                      "display-lg": ["Space Grotesk"],
                      "headline-lg-mobile": ["Space Grotesk"],
                      "label-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "metric-sm": ["Space Grotesk"],
                      "headline-lg": ["Space Grotesk"]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface">
<!-- TopAppBar -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding py-4 backdrop-blur-xl bg-surface-container/40">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-card hover:bg-white/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md font-bold tracking-widest text-primary drop-shadow-[0_0_10px_rgba(75,226,119,0.5)]">LUMINA</span>
</div>
</div>
<div class="flex items-center gap-2 px-4 py-1.5 glass-card rounded-full border border-white/5">
<span class="material-symbols-outlined text-secondary text-[18px]">table_restaurant</span>
<span class="font-label-md text-label-md text-on-surface">Table 05</span>
</div>
</nav>
<main class="pt-24 pb-32 px-container-padding max-w-2xl mx-auto space-y-8">
<!-- Payment Summary Section -->
<section class="animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="glass-card rounded-[2rem] p-8 text-center flex flex-col items-center justify-center neon-glow-azure border border-white/5">
<span class="font-label-md text-label-md tracking-[0.2em] text-secondary mb-2 uppercase">Total Due</span>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-on-surface">₦19,887.50</span>
</div>
<div class="mt-4 flex items-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-sm">receipt_long</span>
<span class="font-label-sm text-label-sm">Order #88291 • 4 Items</span>
</div>
</div>
</section>
<!-- Settle Methods Grid -->
<section class="grid grid-cols-2 gap-bento-gap">
<!-- Cash -->
<button class="glass-card p-6 rounded-2xl flex flex-col items-center gap-4 border border-white/5 hover:bg-white/10 active:scale-95 transition-all group active-settle-card" onclick="selectMethod(this)">
<div class="w-12 h-12 rounded-xl bg-primary/20 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">payments</span>
</div>
<span class="font-label-md text-label-md">Cash</span>
</button>
<!-- Card -->
<button class="glass-card p-6 rounded-2xl flex flex-col items-center gap-4 border border-white/5 hover:bg-white/10 active:scale-95 transition-all group" onclick="selectMethod(this)">
<div class="w-12 h-12 rounded-xl bg-secondary/20 flex items-center justify-center text-secondary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">credit_card</span>
</div>
<span class="font-label-md text-label-md">Card</span>
</button>
<!-- Transfer -->
<button class="glass-card p-6 rounded-2xl flex flex-col items-center gap-4 border border-white/5 hover:bg-white/10 active:scale-95 transition-all group" onclick="selectMethod(this)">
<div class="w-12 h-12 rounded-xl bg-tertiary/20 flex items-center justify-center text-tertiary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">account_balance</span>
</div>
<span class="font-label-md text-label-md">Transfer</span>
</button>
<!-- USSD -->
<button class="glass-card p-6 rounded-2xl flex flex-col items-center gap-4 border border-white/5 hover:bg-white/10 active:scale-95 transition-all group" onclick="selectMethod(this)">
<div class="w-12 h-12 rounded-xl bg-primary-fixed-dim/20 flex items-center justify-center text-primary-fixed-dim group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl">dialpad</span>
</div>
<span class="font-label-md text-label-md">USSD</span>
</button>
</section>
<!-- Input Area -->
<section class="space-y-4">
<div class="glass-card rounded-2xl p-6 border border-white/5">
<div class="flex justify-between items-center mb-6">
<span class="font-label-md text-label-md text-on-surface-variant">Paying Now</span>
<span class="font-metric-sm text-metric-sm text-primary">Full Amount</span>
</div>
<div class="flex items-center justify-between bg-surface-container-lowest/50 p-4 rounded-xl border border-white/5 focus-within:ring-1 focus-within:ring-secondary transition-all">
<span class="font-headline-md text-headline-md text-on-surface-variant/40">₦</span>
<input class="bg-transparent border-none text-right w-full font-headline-md text-headline-md focus:ring-0 text-on-surface" readonly="" type="text" value="19,887.50"/>
</div>
</div>
<!-- Numeric Keyboard Micro-Interaction Placeholder -->
<div class="grid grid-cols-3 gap-2 px-4 py-2">
<!-- Simple visual cues for the keypad intent -->
<div class="h-1 w-full bg-white/5 rounded-full"></div>
<div class="h-1 w-full bg-white/5 rounded-full"></div>
<div class="h-1 w-full bg-white/5 rounded-full"></div>
</div>
</section>
</main>
<!-- Final Action Button Container -->
<footer class="fixed bottom-0 left-0 w-full p-inner-padding glass-card bg-surface/80 backdrop-blur-3xl z-40 border-t border-white/5">
<div class="max-w-2xl mx-auto">
<button class="w-full py-5 rounded-2xl bg-primary text-on-primary-container font-headline-md text-headline-md font-bold uppercase tracking-widest neon-glow-primary active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span>Complete Payment</span>
<span class="material-symbols-outlined font-bold">check_circle</span>
</button>
</div>
</footer>
<!-- Atmosphere Layer -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute -top-1/4 -right-1/4 w-[600px] h-[600px] bg-secondary/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
<script>
        function selectMethod(el) {
            // Remove active class from all
            document.querySelectorAll('button[onclick="selectMethod(this)"]').forEach(btn => {
                btn.classList.remove('active-settle-card');
                btn.classList.remove('ring-1');
                btn.classList.remove('ring-primary/30');
            });
            // Add to selected
            el.classList.add('active-settle-card');
            el.classList.add('ring-1');
            el.classList.add('ring-primary/30');
            
            // Haptic feedback feel
            el.style.transform = 'scale(0.95)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
            }, 100);
        }
    </script>
</body></html>
