<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ServeIQ Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#ffb690",
                        "on-secondary-fixed-variant": "#404758",
                        "secondary": "#575e70",
                        "primary-fixed": "#ffdbca",
                        "primary": "#9d4300",
                        "on-tertiary-container": "#003554",
                        "on-primary-fixed-variant": "#783200",
                        "inverse-on-surface": "#ebf1ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#341100",
                        "surface-bright": "#f9f9ff",
                        "on-secondary-fixed": "#141b2b",
                        "tertiary": "#006398",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#004b74",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#dce2f3",
                        "outline-variant": "#e0c0b1",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-surface": "#151c27",
                        "secondary-fixed-dim": "#c0c6db",
                        "tertiary-fixed-dim": "#93ccff",
                        "surface-container-high": "#e2e8f8",
                        "outline": "#8c7164",
                        "secondary-fixed": "#dce2f7",
                        "primary-container": "#f97316",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#582200",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d9dff5",
                        "on-surface-variant": "#584237",
                        "surface-container-low": "#f0f3ff",
                        "on-background": "#151c27",
                        "surface-tint": "#9d4300",
                        "surface-container-highest": "#dce2f3",
                        "on-secondary-container": "#5c6274",
                        "on-tertiary-fixed": "#001d32",
                        "inverse-primary": "#ffb690",
                        "surface-container": "#e7eefe",
                        "tertiary-fixed": "#cde5ff",
                        "tertiary-container": "#00a2f4",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d3daea",
                        "inverse-surface": "#2a313d",
                        "background": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-web": "24px",
                        "gutter-mobile": "16px",
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "tap-target-min": "48px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "mono-sm": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "mono-xs": ["JetBrains Mono"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "mono-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "mono-xs": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        .login-card {
            box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-background p-gutter-mobile md:p-0">
<!-- Suppression of Nav Shell: This is a Transactional/Login page -->
<main class="w-full max-w-[440px]">
<!-- Login Card Container -->
<div class="login-card bg-surface-container-lowest rounded-xl p-8 border border-surface-variant flex flex-col items-center">
<!-- ServeIQ Logo Section -->
<div class="mb-8 flex flex-col items-center gap-2">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface tracking-tight font-extrabold">ServeIQ</span>
</div>
<!-- Header -->
<div class="w-full mb-8">
<h1 class="font-headline-md text-headline-md text-[#111827] text-center font-bold">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Enter your credentials to manage your floor.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-6" method="POST" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-[48px] px-4 rounded-lg bg-surface-bright border border-surface-variant outline-none transition-all duration-200 focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container text-on-surface font-body-md placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="name@restaurant.com" required="" type="email"/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-on-surface-variant/40">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<div class="relative group">
<input class="w-full h-[48px] px-4 rounded-lg bg-surface-bright border border-surface-variant outline-none transition-all duration-200 focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container text-on-surface font-body-md placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant/60 hover:text-primary-container transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between py-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-surface-variant text-primary-container focus:ring-primary-container cursor-pointer" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary-container text-white font-label-md text-label-md rounded-xl shadow-lg shadow-primary-container/20 hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Social/Internal Switcher (Subtle) -->
<div class="mt-8 pt-6 border-t border-surface-variant w-full text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
                    Need help? <a class="text-primary font-bold hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- System Status Footer -->
<div class="mt-8 flex items-center justify-center gap-6 opacity-40">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
<span class="font-mono-xs text-mono-xs uppercase tracking-widest text-on-surface-variant">System Operational</span>
</div>
<span class="text-on-surface-variant font-mono-xs">v2.4.0-ADMIN</span>
</div>
</main>
<!-- Micro-interaction Scripts -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Add a subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.login-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
