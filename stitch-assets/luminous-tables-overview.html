<script>
        // Micro-interaction for table cards
        document.querySelectorAll('button.glass-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.95)';
                card.style.filter = 'brightness(1.2)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
                card.style.filter = 'brightness(1)';
            });
        });

        // Atmospheric parallax effect on background
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth) * 20;
            const moveY = (e.clientY / window.innerHeight) * 20;
            document.body.style.backgroundPosition = `${moveX}px ${moveY}px`;
        });
    </script>
