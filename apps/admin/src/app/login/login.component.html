<main class="min-h-screen flex items-center justify-center bg-[#ffffff] p-4 md:p-0">
  <div class="w-full max-w-[440px]">
    <!-- Login Card -->
    <div class="login-card bg-white rounded-xl p-8 border border-[#e0c0b1]/30 flex flex-col items-center">
      <!-- Logo -->
      <div class="mb-8 flex flex-col items-center gap-2">
        <div class="w-12 h-12 bg-[#F97316] rounded-lg flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings:'FILL'1">restaurant</span>
        </div>
        <span class="text-[24px] leading-[32px] font-semibold text-[#151c27] tracking-tight font-extrabold" style="font-family:'Inter',sans-serif">ServeIQ</span>
      </div>
      <!-- Header -->
      <div class="w-full mb-8">
        <h1 class="text-[24px] leading-[32px] font-semibold text-[#111827] text-center font-bold" style="font-family:'Inter',sans-serif">Welcome back</h1>
        <p class="text-[16px] leading-[24px] text-[#584237] text-center mt-2" style="font-family:'Inter',sans-serif">Enter your credentials to manage your floor.</p>
      </div>
      <!-- Login Form -->
      <form class="w-full space-y-6" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="space-y-2">
          <label class="text-[14px] leading-[20px] font-semibold text-[#151c27]" style="font-family:'Inter',sans-serif" for="email">Email Address</label>
          <div class="relative group">
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="name@restaurant.com"
              required
              class="w-full h-[48px] px-4 rounded-lg bg-[#f9f9ff] border border-[#e0c0b1]/50 outline-none transition-all duration-200 focus:ring-2 focus:ring-[#F97316]/20 focus:border-[#F97316] text-[#151c27] text-[16px] leading-[24px] placeholder:text-[#584237]/50"
              style="font-family:'Inter',sans-serif"
            />
            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-[#584237]/40">
              <span class="material-symbols-outlined text-[20px]">mail</span>
            </div>
          </div>
        </div>
        <!-- Password -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-[14px] leading-[20px] font-semibold text-[#151c27]" style="font-family:'Inter',sans-serif" for="password">Password</label>
          </div>
          <div class="relative group">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              required
              class="w-full h-[48px] px-4 rounded-lg bg-[#f9f9ff] border border-[#e0c0b1]/50 outline-none transition-all duration-200 focus:ring-2 focus:ring-[#F97316]/20 focus:border-[#F97316] text-[#151c27] text-[16px] leading-[24px] placeholder:text-[#584237]/50"
              style="font-family:'Inter',sans-serif"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-4 flex items-center text-[#584237]/60 hover:text-[#F97316] transition-colors"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              <span class="material-symbols-outlined text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between py-1">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" class="w-4 h-4 rounded border-[#e0c0b1]/50 text-[#F97316] focus:ring-[#F97316] cursor-pointer" />
            <span class="text-[14px] leading-[20px] font-semibold text-[#584237] group-hover:text-[#151c27] transition-colors" style="font-family:'Inter',sans-serif">Remember me</span>
          </label>
          <button type="button" class="text-[14px] leading-[20px] font-semibold text-[#9d4300] hover:underline transition-all border-none bg-transparent cursor-pointer" style="font-family:'Inter',sans-serif" (click)="forgotPassword()">Forgot password?</button>
        </div>
        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full h-[48px] bg-[#F97316] text-white text-[14px] leading-[20px] font-semibold rounded-xl shadow-lg shadow-[#F97316]/20 hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
          style="font-family:'Inter',sans-serif"
        >
          <span>{{ isLoading() ? 'Signing in...' : 'Sign In' }}</span>
          <span *ngIf="!isLoading()" class="material-symbols-outlined text-[18px]">login</span>
        </button>
      </form>
      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-[#e0c0b1]/30 w-full text-center">
        <p class="text-[14px] leading-[20px] font-semibold text-[#584237]" style="font-family:'Inter',sans-serif">
          Need help? <a class="text-[#9d4300] font-bold hover:underline" href="#">Contact Support</a>
        </p>
      </div>
    </div>
    <!-- System Status -->
    <div class="mt-8 flex items-center justify-center gap-6 opacity-40">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-[12px] leading-[16px] uppercase tracking-widest text-[#584237]" style="font-family:'JetBrains Mono',monospace">System Operational</span>
      </div>
      <span class="text-[#584237] text-[12px] leading-[16px]" style="font-family:'JetBrains Mono',monospace">v2.4.0-ADMIN</span>
    </div>
  </div>
</main>
