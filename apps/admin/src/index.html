<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>ServeIQ - Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="assets/brand/serveiq-logo.png" />
    <!-- Material Icons - preload and block rendering until ready -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <!-- Inline Preloader Styles -->
    <style>
      #sq-preloader { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #0f172a; transition: opacity 0.4s ease, visibility 0.4s ease; }
      #sq-preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .sq-preloader-inner { text-align: center; }
      .sq-preloader-logo { width: 72px; height: 72px; margin: 0 auto 20px; animation: sq-logo-pop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
      .sq-preloader-logo svg { width: 100%; height: 100%; }
      .sq-preloader-ring { stroke-dasharray: 220; stroke-dashoffset: 220; animation: sq-ring-draw 1.4s ease-in-out infinite; stroke: #4be277; }
      .sq-preloader-text { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #4be277; animation: sq-text-pulse 2s ease-in-out infinite; }
      @keyframes sq-logo-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes sq-ring-draw { 0% { stroke-dashoffset: 220; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -220; } }
      @keyframes sq-text-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      /* Hide preloader when app is ready */
      app-root:not([hidden]) ~ #sq-preloader,
      body.sq-loaded #sq-preloader { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
  <body>
    <div id="sq-preloader" aria-hidden="true">
      <div class="sq-preloader-inner">
        <div class="sq-preloader-logo" role="img" aria-label="ServeIQ loading">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="#4be277" stroke-width="3" fill="none" class="sq-preloader-ring"/>
            <path d="M18 32 L28 42 L46 22" stroke="#4be277" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" style="opacity:0.9"/>
            <circle cx="32" cy="32" r="12" fill="#4be277" style="opacity:0.15"/>
          </svg>
        </div>
        <div class="sq-preloader-text">Loading ServeIQ</div>
      </div>
    </div>
    <app-root></app-root>
    <script>
      // Mark body as loaded when Angular bootstrap completes
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var app = document.querySelector('app-root');
          if (app && app.children.length > 0) {
            document.body.classList.add('sq-loaded');
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        // Fallback timeout
        setTimeout(function() { document.body.classList.add('sq-loaded'); }, 8000);
      });
    </script>
  </body>
</html>
