<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ServeIQ Waiter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Material Symbols Outlined - preload and block rendering until ready -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Inline Video Preloader Styles -->
    <style>
      #sq-preloader { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #0f172a; transition: opacity 0.5s ease, visibility 0.5s ease; }
      #sq-preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #sq-preloader video { width: 180px; height: 180px; object-fit: contain; }
      app-root:not([hidden]) ~ #sq-preloader,
      body.sq-loaded #sq-preloader { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="sq-preloader" aria-hidden="true">
      <video playsinline autoplay loop muted>
        <source src="assets/preloader.mp4" type="video/mp4" />
      </video>
    </div>
    <app-root></app-root>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var app = document.querySelector('app-root');
          if (app && app.children.length > 0) {
            document.body.classList.add('sq-loaded');
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function() { document.body.classList.add('sq-loaded'); }, 10000);
      });
    </script>
  </body>
</html>
