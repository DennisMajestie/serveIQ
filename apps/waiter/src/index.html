<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ServeIQ Waiter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Material Symbols Outlined - preload and block rendering until ready -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Inline Preloader Styles -->
    <style>
#sq-preloader { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; transition: opacity 0.4s ease, visibility 0.4s ease, background 0.3s ease; }
      #sq-preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .sq-preloader-logo { width: 140px; height: 140px; animation: sq-logo-pulse 2s ease-in-out infinite; position: relative; }
      .sq-preloader-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .sq-preloader-logo .sq-logo-light { display: block; }
      .sq-preloader-logo .sq-logo-dark { display: none; }
      .sq-preloader-text { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #64748b; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); }
      @keyframes sq-logo-pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.03); opacity: 1; } }
      @media (prefers-color-scheme: light) {
        #sq-preloader { background: #ffffff; }
        .sq-preloader-text { color: #475569; }
        .sq-preloader-logo .sq-logo-light { display: none; }
        .sq-preloader-logo .sq-logo-dark { display: block; }
      }
      app-root:not([hidden]) ~ #sq-preloader,
      body.sq-loaded #sq-preloader { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="sq-preloader" aria-hidden="true">
      <div class="sq-preloader-logo" role="img" aria-label="ServeIQ loading">
        <img class="sq-logo-light" src="assets/serveiq-logo.png" alt="ServeIQ" />
        <img class="sq-logo-dark" src="assets/serveiq-dark-logo.png" alt="ServeIQ" />
      </div>
      <span class="sq-preloader-text">from ServeIQ</span>
    </div>
    <app-root></app-root>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var app = document.querySelector('app-root');
          if (app && app.children.length > 0) {
            document.body.classList.add('sq-loaded');
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function() { document.body.classList.add('sq-loaded'); }, 8000);
      });

      // Force correct logo for preloader based on actual background
      (function() {
        var preloader = document.getElementById('sq-preloader');
        var lightLogo = preloader?.querySelector('.sq-logo-light');
        var darkLogo = preloader?.querySelector('.sq-logo-dark');
        if (!lightLogo || !darkLogo) return;

        function setLogo() {
          var bg = window.getComputedStyle(preloader).backgroundColor;
          var isDark = false;
          if (bg) {
            var lower = bg.toLowerCase();
            isDark = lower.includes('15, 23, 42') || 
                     lower.includes('#0f172a') || 
                     lower === 'rgb(15, 23, 42)' ||
                     lower === 'rgba(15, 23, 42, 1)';
          }
          lightLogo.style.display = isDark ? 'block' : 'none';
          darkLogo.style.display = isDark ? 'none' : 'block';
        }

        setLogo();
        setTimeout(setLogo, 50);
        setTimeout(setLogo, 200);
      })();
    </script>
  </body>
</html>
