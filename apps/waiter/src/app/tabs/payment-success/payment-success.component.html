<div class="mesh-bg min-h-screen overflow-x-hidden pb-32">
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <!-- Top App Bar -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 backdrop-blur-xl bg-[#191f31]/40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-[#4be277]/20 flex items-center justify-center overflow-hidden">
        <span class="material-symbols-outlined text-[#4be277]">check</span>
      </div>
      <h1 class="text-[24px] leading-[1.3] font-bold tracking-widest text-[#4be277]" style="font-family:'Space Grotesk',sans-serif;text-shadow:0 0 10px rgba(75,226,119,0.5)">{{ businessName }}</h1>
    </div>
    <button (click)="goToTables()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 transition-all active:scale-95 duration-200">
      <span class="material-symbols-outlined text-[#bccbb9]">close</span>
    </button>
  </header>

  <main class="pt-32 pb-32 px-4 max-w-2xl mx-auto flex flex-col items-center min-h-screen relative z-10">
    <!-- Success Section -->
    <div class="flex flex-col items-center text-center mb-12">
      <div class="w-28 h-28 mb-8 rounded-full bg-[#4be277]/10 flex items-center justify-center animate-pulse-glow">
        <span class="material-symbols-outlined text-[#4be277] !text-[72px]" style="font-variation-settings:'FILL' 1">check_circle</span>
      </div>
      <p class="text-[14px] leading-none font-semibold text-[#4be277] uppercase tracking-widest mb-3" style="font-family:'Inter',sans-serif">Payment Successful</p>
      <h1 class="text-[20px] leading-[1.3] font-bold text-[#dce1fb] mb-2" style="font-family:'Space Grotesk',sans-serif">Transaction Complete</h1>
      @if (isLoading()) {
        <div class="h-10 w-48 rounded-xl bg-white/5 animate-pulse mt-4"></div>
      } @else if (amountPaid() != null) {
        <div class="mt-4 px-8 py-4 rounded-2xl bg-[#4be277]/10 border border-[#4be277]/20">
          <p class="text-[12px] leading-none font-semibold text-[#bccbb9]/70 uppercase tracking-widest mb-2" style="font-family:'Inter',sans-serif">Amount Paid</p>
          <p class="text-[40px] leading-[1.1] font-bold text-white" style="font-family:'Space Grotesk',sans-serif;text-shadow:0 0 30px rgba(75,226,119,0.5)">{{ currencySymbol() }}{{ formatAmount(amountPaid() ?? 0) }}</p>
        </div>
      }
    </div>

    <!-- Primary Action -->
    <button (click)="viewReceipt()" class="bloom-btn w-full bg-[#4be277] text-[#003915] py-5 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all mb-4">
      <span class="material-symbols-outlined font-bold">receipt_long</span>
      <span class="text-[24px] leading-[1.3] font-bold" style="font-family:'Space Grotesk',sans-serif">VIEW RECEIPT</span>
    </button>

    <!-- Secondary Action -->
    <button (click)="goToTables()" class="w-full py-4 glass-card rounded-2xl hover:bg-white/10 transition-all active:scale-95 flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-[20px] text-[#bccbb9]">table_restaurant</span>
      <span class="text-[16px] leading-none font-semibold text-white" style="font-family:'Inter',sans-serif">Back to Tables</span>
    </button>

    <!-- Publicity Branding -->
    <div class="branding-strip mt-12">
      <span class="branding-icon">♦</span>
      <span>Powered by ServeIQ Inc</span>
      <span class="branding-icon">♦</span>
    </div>
  </main>

  <!-- Background Atmospheric Effect -->
  <div class="fixed inset-0 pointer-events-none -z-0 overflow-hidden">
    <div class="absolute top-[20%] right-[10%] w-[300px] h-[300px] bg-[#4be277]/5 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[20%] left-[10%] w-[400px] h-[400px] bg-[#0566d9]/5 blur-[150px] rounded-full"></div>
  </div>
</div>
